[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capcrack"
version = "0.2.0"
description = "A CTF-focused PCAP triage helper"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scapy>=2.5.0",
]

[project.scripts]
capcrack = "capcrack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]